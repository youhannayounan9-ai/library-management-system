<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Management System</title>
  <style>
    :root {
      --bg: #0f172a;
      --glass: rgba(255, 255, 255, 0.08);
      --accent: #3b82f6;
      --text: #e2e8f0;
      --error: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    h1,
    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .hidden {
      display: none !important;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-danger {
      background: var(--error);
      color: white;
    }

    .input-group {
      margin-bottom: 1rem;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .input-group input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.2);
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 1rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .status-msg {
      padding: 0.8rem;
      border-radius: 6px;
      margin-top: 1rem;
      text-align: center;
    }

    .error {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid var(--error);
    }

    .success {
      background: rgba(34, 197, 94, 0.2);
      color: #86efac;
      border: 1px solid var(--success);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 2rem 0 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.5rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>📚 Library Management System</h1>

    <div id="authSection">
      <h2>Sign In / Register</h2>
      <div class="input-group"><label>Email</label><input type="email" id="email" placeholder="email@example.com"></div>
      <div class="input-group"><label>Password</label><input type="password" id="password" placeholder="******"></div>
      <div class="input-group"><label>Role (Required for Registration Only)</label><input type="text" id="role"
          placeholder="admin or member"></div>
      <button class="btn btn-primary" style="width: 100%;" onclick="handleAuth()">Continue</button>
      <div id="authStatus"></div>
    </div>

    <div id="dashboardSection" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <h2 id="welcomeUser" style="margin:0; text-align:left;">Dashboard</h2>
          <small id="userRoleDisplay" style="color: var(--accent); text-transform: uppercase;"></small>
        </div>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
      </div>

      <div id="adminForm" class="hidden"
        style="margin-top:2rem; background:rgba(0,0,0,0.2); padding:1.5rem; border-radius:12px;">
        <h3>Manage Inventory: Add New Book</h3>
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
          <input type="text" id="title" class="input-group input" style="padding:0.75rem" placeholder="Title">
          <input type="text" id="author" class="input-group input" style="padding:0.75rem" placeholder="Author">
          <input type="text" id="isbn" class="input-group input" style="padding:0.75rem" placeholder="ISBN">
          <input type="number" id="copies" class="input-group input" style="padding:0.75rem" placeholder="Total Copies">
        </div>
        <button class="btn btn-primary" style="width:100%; margin-top:1rem;" onclick="addBook()">Add to Library</button>
      </div>

      <div class="section-header">
        <h3>Available Books</h3>
        <button class="btn btn-primary" style="font-size: 0.8rem;" onclick="loadBooks()">Refresh List</button>
      </div>
      <div id="booksList" class="grid"></div>

      <div id="historySection" class="hidden">
        <div class="section-header">
          <h3>Your Borrowing History</h3>
        </div>
        <div id="historyList" class="grid"></div>
      </div>

      <div id="globalStatus"></div>
    </div>
  </div>

  <script>
    const API = "http://localhost:8000";
    let token = localStorage.getItem("token");

    function parseJwt(t) { try { return JSON.parse(atob(t.split('.')[1])); } catch (e) { return null; } }

    function init() {
      if (token) {
        const user = parseJwt(token);
        if (user) {
          showDashboard(user);
          loadBooks();
          if (user.role === 'member') loadHistory();
        } else { logout(); }
      } else { showAuth(); }
    }

    function showAuth() {
      document.getElementById("authSection").classList.remove("hidden");
      document.getElementById("dashboardSection").classList.add("hidden");
    }

    function showDashboard(user) {
      document.getElementById("authSection").classList.add("hidden");
      document.getElementById("dashboardSection").classList.remove("hidden");
      document.getElementById("userRoleDisplay").innerText = `Role: ${user.role}`;

      // Requirement: Admin has full control, Member has limited access
      if (user.role === 'admin') {
        document.getElementById("adminForm").classList.remove("hidden");
        document.getElementById("historySection").classList.add("hidden");
      } else {
        document.getElementById("adminForm").classList.add("hidden");
        document.getElementById("historySection").classList.remove("hidden");
      }
    }

    async function handleAuth() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const roleInput = document.getElementById("role").value;
      const status = document.getElementById("authStatus");
      const isReg = roleInput.trim() !== "";

      try {
        const res = await fetch(`${API}/auth/${isReg ? 'register' : 'login'}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password, role: roleInput.toLowerCase() })
        });
        const data = await res.json();
        if (res.ok && data.access_token) {
          token = data.access_token;
          localStorage.setItem("token", token);
          init();
        } else {
          status.innerHTML = `<div class="status-msg error">❌ ${data.detail || "Auth Failed"}</div>`;
        }
      } catch (e) { status.innerHTML = `<div class="status-msg error">❌ Connection Error</div>`; }
    }

    async function loadBooks() {
      const list = document.getElementById("booksList");
      const user = parseJwt(token);
      try {
        const res = await fetch(`${API}/books/`, { headers: { Authorization: `Bearer ${token}` } });
        const books = await res.json();
        list.innerHTML = "";
        books.forEach(b => {
          const isAdmin = user.role === 'admin';
          // Requirement: Action buttons based on role (Admin deletes, Member borrows)
          const actionBtn = isAdmin
            ? `<button class="btn btn-danger" style="width:100%; margin-top:1rem" onclick="deleteBook(${b.id})">Delete Book</button>`
            : `<button class="btn btn-success" style="width:100%; margin-top:1rem" onclick="borrowBook(${b.id})">Borrow This Book</button>`;

          list.innerHTML += `
            <div class="card">
              <h4>${b.title}</h4>
              <p><small>${b.author} | ISBN: ${b.isbn}</small></p>
              <p style="margin-top:0.5rem; color:${b.available_copies > 0 ? 'var(--success)' : 'var(--error)'}">
                Status: ${b.available_copies} available
              </p>
              ${actionBtn}
            </div>`;
        });
      } catch (e) { console.error(e); }
    }

    // Requirement: Borrow system with availability validation
    async function borrowBook(bookId) {
      const status = document.getElementById("globalStatus");
      try {
        const res = await fetch(`${API}/borrow/${bookId}`, {
          method: "POST",
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        if (res.ok) {
          status.innerHTML = `<div class="status-msg success">✅ Borrowed!</div>`;
          loadBooks(); loadHistory();
        } else {
          status.innerHTML = `<div class="status-msg error">❌ ${data.detail || "Could not borrow"}</div>`;
        }
      } catch (e) { status.innerHTML = `<div class="status-msg error">❌ Server Error</div>`; }
    }

    // Requirement: Track personal borrowing history
    async function loadHistory() {
      const list = document.getElementById("historyList");
      try {
        const res = await fetch(`${API}/borrow/history`, { headers: { Authorization: `Bearer ${token}` } });
        const history = await res.json();
        list.innerHTML = history.length ? "" : "<p>No records found.</p>";
        history.forEach(h => {
          list.innerHTML += `
            <div class="card" style="border-left: 4px solid var(--accent)">
              <strong>${h.book_title}</strong><br>
              <small>Borrowed: ${new Date(h.borrow_date).toLocaleDateString()}</small><br>
              <button class="btn btn-primary" style="margin-top:0.5rem; font-size:0.7rem;" onclick="returnBook(${h.id})">Return Book</button>
            </div>`;
        });
      } catch (e) { console.error(e); }
    }

    async function returnBook(recordId) {
      try {
        const res = await fetch(`${API}/return/${recordId}`, {
          method: "POST",
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.ok) { loadBooks(); loadHistory(); }
      } catch (e) { console.error(e); }
    }

    async function addBook() {
      const payload = {
        title: document.getElementById("title").value,
        author: document.getElementById("author").value,
        isbn: document.getElementById("isbn").value,
        available_copies: parseInt(document.getElementById("copies").value)
      };
      try {
        const res = await fetch(`${API}/books/`, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
          body: JSON.stringify(payload)
        });
        if (res.ok) { loadBooks(); }
      } catch (e) { console.error(e); }
    }

    async function deleteBook(id) {
      if (!confirm("Confirm removal?")) return;
      try {
        await fetch(`${API}/books/${id}`, { method: "DELETE", headers: { Authorization: `Bearer ${token}` } });
        loadBooks();
      } catch (e) { console.error(e); }
    }

    function logout() { localStorage.removeItem("token"); location.reload(); }

    init();
  </script>
</body>

</html>
